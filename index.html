<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CityBrowser — AI Asset Management · Illegal Dump Tracking</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#12324A; --navy2:#1C4664; --amber:#F2A900; --amber2:#FFD35C; --paper:#FFFFFF; --ground:#EEF2F1; --ink:#1B2430; --ink2:#4A5866; --mut:#768594;
  --line:#D5DCE0; --line2:#E6EBEE; --ok:#2E8B57; --hi:#C8402D; --med:#C77C02; --pro:#5B4BB7; --water:#CFE3EA; --land:#E6ECE4; --road:#F7D27A;
  --r:10px; --font:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --disp:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#16222C; --ground:#0F1820; --ink:#E7EDF1; --ink2:#B5C2CC; --mut:#8C9BA7; --line:#2A3945; --line2:#22303B; --water:#16364A; --land:#1B2A24; --road:#8A6A1F; } }
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px) }
html{ scroll-padding-top:env(safe-area-inset-top,0px) }
*,*::before,*::after{ box-sizing:inherit }
body{ margin:0; background:var(--ground); color:var(--ink); font:15px/1.5 var(--font); -webkit-font-smoothing:antialiased }
button,input,select,textarea{ font:inherit; color:inherit }
:focus-visible{ outline:3px solid var(--amber); outline-offset:2px }
h1,h2,h3{ font-family:var(--disp); font-weight:600; letter-spacing:.005em; margin:0; line-height:1.1 }
h2{ font-size:22px } h3{ font-size:18px }
.mut{ color:var(--mut) } .ink2{ color:var(--ink2) } .small{ font-size:13px } .tiny{ font-size:12px }
/* top bar */
.top{ position:sticky; top:env(safe-area-inset-top,0px); z-index:30; background:var(--navy); color:#fff; display:flex; align-items:center; gap:18px; padding:10px 20px; flex-wrap:wrap }
.brand{ display:flex; align-items:center; gap:10px; text-decoration:none; color:#fff }
.brand svg{ flex:none } .brand b{ font-family:var(--disp); font-size:26px; font-weight:700; letter-spacing:.01em } .brand b span{ color:var(--amber) }
.council{ font-size:13px; color:#C9D7E1; border-left:1px solid #2F5574; padding-left:14px }
.roles{ margin-left:auto; display:flex; gap:4px; background:#0C2538; padding:4px; border-radius:999px }
.roles button{ border:0; background:none; color:#C9D7E1; padding:7px 14px; border-radius:999px; cursor:pointer; font-weight:600; font-size:14px }
.roles button[aria-pressed="true"]{ background:var(--amber); color:#1B2430 }
/* layout */
.wrap{ padding:18px 20px 40px; max-width:1680px; margin:0 auto }
.ws{ display:grid; grid-template-columns:330px minmax(0,1fr) 400px; gap:14px; align-items:start }
@media (max-width:1250px){ .ws{ grid-template-columns:300px minmax(0,1fr) } .ws>.detail{ grid-column:1/-1 } }
@media (max-width:820px){ .ws{ grid-template-columns:1fr } .top{ gap:10px } .roles{ margin-left:0 } .council{ border:0; padding:0 } }
.panel{ background:var(--paper); border:1px solid var(--line); border-radius:var(--r) }
.pad{ padding:14px 16px }
.hd{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:8px }
/* buttons */
.btn{ border:1px solid var(--line); background:var(--paper); border-radius:8px; padding:8px 14px; cursor:pointer; font-weight:600; font-size:14px }
.btn:hover{ border-color:var(--navy2) }
.btn.pri{ background:var(--navy); border-color:var(--navy); color:#fff } .btn.pri:hover{ background:var(--navy2) }
.btn.amb{ background:var(--amber); border-color:var(--amber); color:#1B2430 }
.btn.warn{ color:var(--hi) } .btn:disabled{ opacity:.45; cursor:not-allowed }
.btns{ display:flex; gap:8px; flex-wrap:wrap; margin-top:12px }
.link{ border:0; background:none; color:var(--navy2); font-weight:600; cursor:pointer; padding:0; text-decoration:underline; text-underline-offset:2px }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .link{ color:var(--amber2) } }
/* tabs */
.tabs{ display:flex; gap:2px; border-bottom:1px solid var(--line); margin:-4px 0 10px; overflow-x:auto }
.tabs button{ border:0; background:none; padding:8px 10px; cursor:pointer; color:var(--ink2); font-weight:600; font-size:13.5px; border-bottom:3px solid transparent; white-space:nowrap }
.tabs button[aria-pressed="true"]{ color:var(--ink); border-bottom-color:var(--amber) }
.count{ display:inline-block; min-width:20px; padding:0 6px; margin-left:4px; border-radius:999px; background:var(--line2); font-size:12px; text-align:center }
/* queue items */
.q{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; max-height:calc(100vh - 230px); overflow:auto }
.qi{ border:1px solid var(--line); border-radius:8px; padding:9px 10px; cursor:pointer; background:var(--paper); display:grid; grid-template-columns:30px 1fr; gap:8px; text-align:left; width:100%; font:inherit }
.qi[aria-current="true"]{ border-color:var(--navy); box-shadow:inset 3px 0 0 var(--amber) }
.qi .t{ font-weight:600; font-size:14px } .qi .m{ font-size:12.5px; color:var(--mut) }
.chan{ width:30px; height:30px; border-radius:8px; display:grid; place-items:center; background:var(--line2); color:var(--navy) }
.flags{ display:flex; gap:4px; flex-wrap:wrap; margin-top:4px }
.flag{ font-size:11.5px; font-weight:600; padding:1px 7px; border-radius:999px; background:var(--line2); color:var(--ink2) }
.flag.hz{ background:#FBE3DF; color:var(--hi) } .flag.ok{ background:#DFF1E6; color:var(--ok) } .flag.dup{ background:#FFF1CC; color:#8A5A00 } .flag.pro{ background:#E7E3FA; color:var(--pro) }
/* map */
.mapbox{ position:relative; overflow:hidden; border-radius:var(--r); border:1px solid var(--line); background:var(--water) }
.mapbox > svg{ display:block; width:100%; height:auto; touch-action:manipulation }
.lbl{ fill:var(--ink2); font-family:var(--font); font-weight:600; letter-spacing:.02em }
.mk{ cursor:pointer } .mk:focus-visible{ outline:none } .mk:focus-visible .tag{ stroke:var(--amber); stroke-width:2.5 }
.legend{ position:absolute; left:10px; bottom:10px; background:color-mix(in srgb, var(--paper) 92%, transparent); border:1px solid var(--line); border-radius:8px; padding:6px 10px; display:flex; gap:12px; flex-wrap:wrap; font-size:12px }
.legend i{ display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; vertical-align:-1px }
/* detail */
.kv{ display:grid; grid-template-columns:auto 1fr; gap:6px 14px; font-size:14px } .kv>span:nth-child(odd){ color:var(--mut) }
.quote{ border-left:3px solid var(--amber); background:var(--ground); padding:8px 10px; border-radius:0 8px 8px 0; font-size:14px; margin:8px 0 }
.steps{ display:flex; gap:4px; margin:10px 0 }
.steps span{ flex:1; height:6px; border-radius:3px; background:var(--line2) } .steps span.on{ background:var(--amber) } .steps span.done{ background:var(--ok) }
.photo{ width:100%; border-radius:8px; display:block; border:1px solid var(--line) }
.pair{ display:grid; grid-template-columns:1fr 1fr; gap:8px } .pair figure{ margin:0 } .pair figcaption{ font-size:12px; color:var(--mut) }
table{ border-collapse:collapse; width:100%; font-size:14px } th,td{ text-align:left; padding:7px 8px; border-bottom:1px solid var(--line2); vertical-align:top } th{ font-size:12.5px; color:var(--mut); font-weight:600 }
.inp{ border:1px solid var(--line); border-radius:8px; padding:8px 10px; background:var(--paper); width:100% }
label.f{ display:block; font-size:13px; font-weight:600; margin:10px 0 4px }
.chips{ display:flex; flex-wrap:wrap; gap:6px } .chip{ border:1px solid var(--line); background:var(--paper); border-radius:999px; padding:6px 12px; cursor:pointer; font-size:13.5px }
.chip[aria-pressed="true"]{ background:var(--navy); color:#fff; border-color:var(--navy) }
.note{ font-size:13px; color:var(--ink2); background:var(--ground); border-radius:8px; padding:8px 10px; margin-top:10px }
.alert{ font-size:13.5px; border-radius:8px; padding:8px 10px; margin-top:10px; background:#FBE3DF; color:#7A2318 }
.okmsg{ font-size:13.5px; border-radius:8px; padding:8px 10px; margin-top:10px; background:#DFF1E6; color:#1D5E3B }
/* intake simulator */
.sim{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:14px }
.sim .lead{ font-family:var(--disp); font-size:19px; font-weight:600; margin-right:4px }
.simb{ display:inline-flex; align-items:center; gap:7px; border:1px dashed var(--navy2); background:var(--paper); border-radius:8px; padding:7px 12px; cursor:pointer; font-weight:600; font-size:13.5px }
.simb:hover{ background:var(--amber2); border-style:solid }
/* phone */
.phone{ width:340px; max-width:100%; background:#0B1620; border-radius:38px; padding:12px; box-shadow:0 18px 40px rgba(12,37,56,.25) }
.screen{ background:var(--paper); border-radius:28px; overflow:hidden; height:640px; display:flex; flex-direction:column }
.pbar{ background:var(--navy); color:#fff; padding:14px 16px 10px; display:flex; align-items:center; justify-content:space-between }
.pbar b{ font-family:var(--disp); font-size:20px } .pbody{ flex:1; overflow:auto; padding:14px 16px }
.slide{ position:relative; height:52px; border-radius:999px; background:var(--ground); border:1px solid var(--line); margin-top:12px; user-select:none }
.slide .knob{ position:absolute; left:4px; top:4px; width:44px; height:44px; border-radius:50%; background:var(--amber); display:grid; place-items:center; cursor:grab; font-weight:700 }
.slide .lab{ position:absolute; inset:0; display:grid; place-items:center; font-weight:600; color:var(--ink2); pointer-events:none }
.ring{ display:block; margin:0 auto }
/* public */
.pub{ display:grid; grid-template-columns:minmax(0,1fr) 360px; gap:28px; align-items:start }
@media (max-width:900px){ .pub{ grid-template-columns:1fr } .phone{ margin:0 auto } }
.ways{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:10px; margin-top:14px }
.way{ border:1px solid var(--line); border-radius:var(--r); background:var(--paper); padding:12px 14px }
.way b{ display:block; font-size:15px } .way .v{ font-family:var(--disp); font-size:22px; font-weight:600; color:var(--navy2); margin:2px 0 }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .way .v{ color:var(--amber2) } }
.hero h1{ font-size:clamp(34px,5vw,56px); font-weight:700; line-height:1; max-width:16ch }
.hero p{ max-width:60ch; color:var(--ink2); font-size:16px }
.toast{ position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--ink); color:var(--paper); padding:10px 16px; border-radius:8px; font-weight:600; font-size:14px; z-index:60; max-width:90vw }
.sub{ display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap } .sub button{ border:1px solid var(--line); background:var(--paper); border-radius:999px; padding:6px 14px; font-weight:600; cursor:pointer; font-size:13.5px }
.sub button[aria-pressed="true"]{ background:var(--ink); color:var(--paper); border-color:var(--ink) }
.scroll{ max-height:calc(100vh - 220px); overflow:auto }
.ws>*{ min-width:0 }
.cws{ grid-template-columns:minmax(0,1fr) 380px 344px }
.two{ grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) }
@media (max-width:1400px){ .cws{ grid-template-columns:minmax(0,1fr) 380px } .cws>section:last-child{ grid-column:1/-1; display:flex; flex-direction:column; align-items:center } }
@media (max-width:820px){ .cws, .two{ grid-template-columns:1fr } .top{ position:static } .q{ max-height:none } .scroll{ max-height:none } }
.pkstrip{ margin-top:22px }
.pkrow{ list-style:none; margin:0; padding:4px 2px 10px; display:flex; gap:14px; overflow-x:auto; scroll-snap-type:x mandatory }
.pkrow li{ flex:none; width:180px; scroll-snap-align:start; display:flex; flex-direction:column; gap:4px }
.pkrow b{ font-size:14px } .pkrow span{ font-size:12.5px; color:var(--ink2); line-height:1.35 }
.pkshot{ padding:6px; border:0; border-radius:26px; background:#0B1620; cursor:zoom-in; box-shadow:0 8px 20px rgba(12,37,56,.18) }
.pkshot img{ display:block; width:100%; height:auto; border-radius:21px }
.bstack{ display:flex; flex-direction:column; line-height:1 } .bstack small{ font-size:11px; letter-spacing:.08em; color:#C9D7E1; margin-top:3px; font-weight:600 }
.council select{ background:#0C2538; color:#fff; border:1px solid #2F5574; border-radius:8px; padding:4px 8px; margin-right:6px }
/* council dashboard (ThinkOS layout) */
body.cs-on .top{ display:none } body.cs-on #app{ max-width:none; padding:0 }
.cs{ display:grid; grid-template-columns:270px minmax(0,1fr); min-height:100vh }
.cs-side{ background:var(--navy); color:#fff; position:sticky; top:0; height:100vh; overflow:auto; display:flex; flex-direction:column; padding-bottom:16px }
.cs-brand{ display:block; padding:30px 26px 26px; text-decoration:none; color:#fff; border-bottom:1px solid #24506d }
.cs-word{ display:block; font-family:var(--disp); font-weight:700; font-size:38px; letter-spacing:.005em; line-height:1 } .cs-word span{ color:var(--amber) }
.cs-by{ display:block; margin-top:8px; font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:#A9BECD; font-weight:600 }
.cs-group{ padding:16px 26px 8px; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:#8FA8BA; font-weight:700; border-top:1px solid #1C4664 }
.cs-nav{ display:flex; align-items:center; gap:14px; width:100%; border:0; background:none; color:#E6EEF3; padding:12px 26px; font-size:16px; text-align:left; cursor:pointer; border-bottom:1px solid #18405b }
.cs-nav:hover{ background:#173d58 } .cs-nav[aria-current="page"]{ background:#1C4664; font-weight:600 }
.cs-ic{ display:grid; place-items:center; width:30px; height:30px; border-radius:50%; flex:none } .cs-nav[aria-current="page"] .cs-ic{ background:var(--amber); color:var(--navy) }
.cs-badge{ margin-left:auto; background:var(--amber); color:var(--navy); font-size:12px; font-weight:700; border-radius:999px; padding:1px 8px }
.cs-foot{ margin-top:auto; padding:16px 26px 0; font-size:12px; color:#8FA8BA }
.cs-main{ padding:28px 36px 40px; min-width:0 }
.cs-eyebrow{ font-size:12px; letter-spacing:.14em; text-transform:uppercase; font-weight:700; color:var(--ink2) }
.cs-title{ display:flex; align-items:center; gap:16px; margin:10px 0 18px; flex-wrap:wrap } .cs-title h1{ font-family:var(--font); font-weight:400; font-size:clamp(30px,3.4vw,40px); letter-spacing:-.01em }
.cs-back{ display:inline-flex; align-items:center; gap:4px; border-radius:999px; padding:7px 16px 7px 10px } .cs-back:disabled{ opacity:.4 }
.cs-sample{ border:1px dashed var(--line); border-radius:999px; padding:3px 10px; font-size:11px; letter-spacing:.1em; text-transform:uppercase; font-weight:700; color:var(--ink2) }
.cs-tools{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:22px }
.cs-pill{ display:inline-flex; align-items:center; gap:8px; border:1px solid var(--line); background:var(--paper); border-radius:10px; padding:6px 12px; font-weight:600 }
.cs-pill select{ border:0; background:none; font-weight:600; padding:4px 0; cursor:pointer }
.cs-seg{ display:inline-flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; background:var(--paper) }
.cs-seg button{ border:0; background:none; padding:9px 16px; cursor:pointer; font-weight:500 } .cs-seg button[aria-pressed="true"]{ background:var(--ink); color:var(--paper); font-weight:600 }
.cs-sp{ flex:1 }
.cs-ib{ position:relative; width:42px; height:42px; border-radius:10px; border:1px solid var(--line); background:var(--paper); display:inline-grid; place-items:center; cursor:pointer; color:var(--ink) }
.cs-dot{ position:absolute; top:-6px; right:-6px; background:var(--hi); color:#fff; font-size:11px; font-weight:700; border-radius:999px; padding:1px 6px }
.cs-user{ display:inline-flex; align-items:center; gap:10px; border:1px solid var(--line); background:var(--paper); border-radius:10px; padding:6px 14px 6px 8px; font-size:13px }
.cs-av{ width:30px; height:30px; border-radius:50%; background:#DFF1E6; color:var(--ok); display:grid; place-items:center; font-weight:700 }
.cs-cards{ display:grid; grid-template-columns:1.15fr 1fr 1fr; gap:18px }
.cs-card{ background:var(--paper); border:1px solid var(--line); border-radius:16px; padding:22px 24px; min-width:0 }
.cs-card h3{ font-family:var(--font); font-weight:500; font-size:19px }
.cs-big{ display:flex; align-items:flex-start; gap:14px; margin:12px 0 4px } .cs-big b{ font-family:var(--font); font-weight:400; font-size:58px; line-height:1 } .cs-big .unit{ font-size:20px; margin-top:28px; margin-left:-8px }
.cs-chart{ width:100%; height:auto; display:block }
.cs-tags{ display:flex; gap:6px; justify-content:center; font-size:13px } .cs-tags span{ padding:4px 10px; border-radius:6px } .cs-tags .on{ border:1px solid var(--line) }
.cs-status{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px 8px; margin-top:12px }
.cs-status button{ border:0; background:none; text-align:left; padding:4px; border-radius:8px; cursor:pointer } .cs-status button[aria-pressed="true"]{ background:var(--ground) }
.cs-status b{ display:block; font-family:var(--font); font-weight:400; font-size:34px; line-height:1.1 } .cs-status span{ font-size:14px; color:var(--ink2) }
.cs-status i, .cs-tr .dot{ display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; vertical-align:1px }
.cs-row{ display:grid; grid-template-columns:minmax(0,2.2fr) minmax(0,1fr); gap:18px; margin-top:4px; align-items:start }
.cs-table{ padding:0 } .cs-filters{ display:flex; align-items:center; gap:10px; padding:16px 18px; border-bottom:1px solid var(--line2); flex-wrap:wrap }
.cs-sel{ position:relative; display:inline-flex; align-items:center } .cs-sel select{ appearance:none; border:1px solid var(--line); border-radius:8px; padding:8px 32px 8px 12px; background:var(--paper) } .cs-sel svg{ position:absolute; right:10px; pointer-events:none }
.cs-search{ display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); border-radius:8px; padding:0 10px; min-width:200px } .cs-search input{ border:0; padding:8px 0; background:none; width:100% }
.cs-table th{ text-transform:uppercase; letter-spacing:.06em; font-size:11.5px; padding:12px 16px } .cs-table td{ padding:12px 16px }
.cs-tr{ cursor:pointer } .cs-tr:hover, .cs-tr[aria-selected="true"]{ background:var(--ground) }
.cs-map{ padding:18px } .cs-map .hd{ align-items:flex-start }
.cs-drawer{ position:fixed; top:0; right:0; bottom:0; width:min(440px,100%); background:var(--paper); border-left:1px solid var(--line); box-shadow:-12px 0 30px rgba(12,37,56,.15); z-index:40; overflow:auto; padding:22px 22px 30px }

@media (max-width:1300px){ .cs-cards{ grid-template-columns:1fr 1fr } .cs-cards>:first-child{ grid-column:1/-1 } .cs-row{ grid-template-columns:1fr } }

.upl{ position:relative; display:inline-flex; align-items:center; gap:6px; overflow:hidden } .upl input{ position:absolute; inset:0; opacity:0; cursor:pointer } .upl.sm{ padding:5px 10px; font-size:12.5px }
.upl:focus-within{ outline:3px solid var(--amber); outline-offset:2px }
.thumbs{ display:grid; grid-template-columns:repeat(auto-fill,minmax(70px,1fr)); gap:6px; margin:8px 0 } .thumbs img{ width:100%; aspect-ratio:1; object-fit:cover; border-radius:6px; border:1px solid var(--line) }
.ph{ border:1px dashed var(--line); border-radius:8px; display:grid; place-items:center; min-height:110px; color:var(--mut); font-size:13px; margin-bottom:6px }
.pair figure figcaption{ margin-bottom:4px }
.oosgrid{ display:grid; grid-template-columns:minmax(0,5fr) minmax(0,7fr); gap:16px; margin-bottom:16px; align-items:start } .oosgrid>*{ min-width:0 }
.oosgrid:first-of-type{ grid-template-columns:minmax(0,1fr) minmax(0,1fr) }
.oos .photo{ max-height:300px; object-fit:cover } .oos figure .photo{ height:240px } .oos table input.inp{ max-width:100% }
.oos [aria-label="Pre-agreed rules"] table td, .oos [aria-label="Pre-agreed rules"] table th{ padding:7px 6px }
.two2{ display:grid; grid-template-columns:1fr 1fr; gap:10px }
@media (max-width:1100px){ .oosgrid{ grid-template-columns:1fr } }
/* job progress */
.jprog{ margin-top:6px; min-width:120px } .jbar{ display:grid; grid-template-columns:repeat(7,1fr); gap:3px } .jbar span{ height:6px; border-radius:3px; background:var(--line2) }

/* AI classification: decides type, hazard and size from the words; code does every number from that */
function classify(text){
  const t = (text || '').toLowerCase(), hit = (re) => re.test(t);
  const type = hit(/asbestos|\bfibro\b|fibrous|cement sheet/) ? 'asbestos' : hit(/\bchemicals?\b|\bdrums?\b|paint tins?|\boil\b|\bacid\b|pesticide/) ? 'chemicals' : hit(/mattress|bed base|ensemble/) ? 'mattress'
    : hit(/\btyres?\b|\btires?\b/) ? 'tyres' : hit(/\btv\b|television|computer|monitor|e-?waste|fridge|microwave/) ? 'ewaste' : hit(/branch|garden|green waste|clippings|\bpalms?\b|\btrees?\b/) ? 'green'
    : hit(/rubble|concrete|brick|tiles|renovation/) ? 'rubble' : hit(/couch|sofa|chair|table|furniture|wardrobe|lounge/) ? 'furniture' : hit(/bag|box|rubbish|trash|household/) ? 'bags' : 'other';
  const n = (t.match(/\b(\d+)\b/) || [])[1];
  const size = hit(/huge|large|pile|lots|trailer/) ? 1.8 : hit(/small|one|single|a few/) ? 0.7 : 1;
  const vol = Math.round(TYPES[type].vol * size * (type === 'tyres' && n ? Math.max(1, +n) / 4 : 1) * 10) / 10;
  const conf = type === 'other' ? 0.55 : 0.78 + (hashStr(t) % 20) / 100;
  return { type, vol, hz:!!TYPES[type].hz, conf:Math.min(0.97, conf) };
}

  ['Anna Bay, Robinson Reserve', ['robinson reserve']], ['Lemon Tree Passage boat ramp', ['lemon tree passage boat ramp','lemon tree boat ramp']], ['Raymond Terrace, William St', ['william st','william street']],
  ['Medowie Rd, Medowie', ['medowie rd','medowie road']], ['Karuah foreshore', ['karuah foreshore']], ['Boat Harbour, Kingsley Dr', ['kingsley dr','kingsley drive']]];
function geoparse(text){
  const t = (text || '').toLowerCase(); let best = null;
  GAZ.forEach(([n, al]) => al.forEach(a => { if(t.includes(a) && (!best || a.length > best.a.length)) best = { n, a }; }));
  return best ? { p:placeOf(best.n), src:`from the words (“${best.a}”)` } : null;    // suburbs alone are too vague, so they aren't listed
}

/* ---------- intake (every channel lands here) ---------- */
// channel names mid-sentence, keeping capitals for SMS, QR code and AR glasses
const chName = k => ({ phone:'phone call', qr:'QR code', sms:'SMS', email:'email', web:'web form', ar:'AR glasses' })[k] || k;
const CH = {
  phone:{ n:'Phone call', who:'anyone' }, qr:{ n:'QR code', who:'anyone' }, sms:{ n:'SMS', who:'anyone' }, email:{ n:'Email', who:'anyone' },
  web:{ n:'Web form', who:'anyone' }, ar:{ n:'AR glasses', who:'rangers' }
};
function intake(r){
  // where: a QR code or the form gives it; otherwise read a known place out of the words; otherwise council pins it
  const gp = r.place ? { p:placeOf(r.place), src: r.ch === 'qr' ? 'QR code' : r.ch === 'ar' ? 'ranger GPS' : 'reporter' } : geoparse(`${r.subject || ''} ${r.text}`);
  const p = gp ? gp.p : null, jitter = mulberry(hashStr(r.text + RSEQ));
  const rep = { id:`CB-${RSEQ++}`, ch:r.ch, text:r.text, subject:r.subject, place:p ? p.n : 'Location to confirm', x:p ? p.x + (jitter() - .5) * 0.45 : null, y:p ? p.y + (jitter() - .5) * 0.45 : null,   // within about ±35 m of the named place
    locSrc:gp ? gp.src : null, photoUrl:r.photoUrl || null,
    photos:r.photos ?? (r.ch === 'phone' || r.ch === 'sms' ? 0 : 1), reporter:r.reporter || {}, ai:classify(r.text), status:'new', time:r.time || now(),
    ranger:r.ch === 'ar' ? (r.ranger || 'Ranger') : null, log:[] };
  if(rep.ranger){ rep.verified = true; if(r.vol) rep.ai.vol = r.vol; }
  // possible duplicate: an open report within 150 m and 72 h of the same kind
  const d = rep.x == null ? null : REPORTS.find(o => o.x != null && !['rejected','merged'].includes(o.status) && (o.ai.type === rep.ai.type || o.ai.type === 'other' || rep.ai.type === 'other')
    && Math.hypot(o.x - rep.x, o.y - rep.y) * KM * 1000 <= 150 && rep.time - o.time < 72 * 36e5);
  if(d) rep.dupOf = d.id;
  REPORTS.unshift(rep);
  rep.log.push({ t:rep.time, s:`Received by ${chName(rep.ch)}${rep.ranger ? ` from ${rep.ranger}` : ''}` });
  notify(rep, 'received');
  return rep;
}
function notify(rep, what, extra){
  const to = rep.reporter.phone ? { ch:'SMS', to:rep.reporter.phone } : rep.reporter.email ? { ch:'Email', to:rep.reporter.email } : null;
  if(!to) return;
  const txt = { received:`Thanks — your report ${rep.id} about ${TYPES[rep.ai.type].n.toLowerCase()} at ${rep.place} is with the council.`,
    booked:`Update on ${rep.id}: a contractor is booked to collect it${extra ? ' ' + extra : ''}.`,
    collected:`Update on ${rep.id}: collected. Thanks for helping keep ${CITY().short} clean.`,
    rejected:`Update on ${rep.id}: ${extra || 'we could not action this report.'}`,
    merged:`Update on ${rep.id}: someone reported this too — we're handling both together.` }[what];
  OUTBOX.unshift({ t:now(), rep:rep.id, ...to, txt });
  rep.log.push({ t:now(), s:`${to.ch} to reporter: “${txt}”` });
}

/* ---------- Exchange ---------- */
function eligibility(c, j){
  const lic = TYPES[j.type].lic, L = c.lic.find(x => x[0] === lic), d = dist(c, j);
  const why = !c.panel ? 'not on the council panel' : !L ? `no ${LIC_N[lic].toLowerCase()} licence` : L[1] < now() ? `${LIC_N[lic].toLowerCase()} licence expired` : c.ins < now() ? 'insurance expired'
    : d > c.km ? `outside ${c.km} km service area` : !c.online ? 'offline' : c.cap < j.vol ? 'not enough vehicle capacity' : null;
  return { c, d, eta:etaMin(c, j), ok:!why, why };
}
const eligibleList = j => CONTRACTORS.map(c => eligibility(c, j)).sort((a, b) => (b.ok - a.ok) || a.d - b.d);
function createJob(rep, mode, price){
  const t = TYPES[rep.ai.type];
  const j = { id:`J-${JSEQ++}`, reports:[rep.id], type:rep.ai.type, vol:rep.ai.vol, hz:rep.ai.hz, x:rep.x, y:rep.y, place:rep.place, price: price ?? t.rate, mode: rep.ai.hz ? 'bid' : mode,
    status:'posted', declined:[], bids:[], created:now(), log:[], approved:!rep.ai.hz };
  JOBS.unshift(j); rep.status = 'posted'; rep.jobId = j.id;
  REPORTS.filter(r => r.dupOf === rep.id && r.status === 'merged').forEach(r => { r.jobId = j.id; });
  j.log.push({ t:now(), s: j.mode === 'instant' ? `Posted to the Exchange at ${money(j.price)}` : `Quotes requested${rep.ai.hz ? ' (hazardous — quotes only)' : ''}` });
  if(j.mode === 'instant') offerNext(j); else inviteBids(j);
  woEvent(rep, 'create');
  return j;
}
function offerNext(j){
  const next = eligibleList(j).find(e => e.ok && !j.declined.includes(e.c.id));
  if(!next){ j.offer = null; j.status = 'posted'; j.log.push({ t:now(), s:'No eligible contractor free — switched to quotes' }); j.mode = 'bid'; inviteBids(j); return; }
  j.offer = { cid:next.c.id, until:now() + OFFER_MS, eta:next.eta };
  j.status = 'offered'; j.log.push({ t:now(), s:`Offered to ${next.c.n} (${fmt(next.d, 1)} km, ${next.eta} min)` });
  if(next.c.id !== S.me) simRespond(j, next.c.id);
}
function simRespond(j, cid){
  const r = mulberry(hashStr(j.id + cid))(), wait = 3500 + r * 5000;
  setTimeout(() => { if(j.offer?.cid !== cid || j.status !== 'offered') return; if(r < 0.22) declineOffer(j, cid, 'passed'); else acceptOffer(j, cid); render(); }, wait);
}
function acceptOffer(j, cid){
  const c = cById(cid); j.status = 'awarded'; j.cid = cid; j.eta = etaMin(c, j); j.awardedAt = now(); j.offer = null;
  j.log.push({ t:now(), s:`${c.n} accepted — ${j.eta} min away` });
  bookedNotify(j); if(cid !== S.me) simWork(j);
}
function declineOffer(j, cid, why){ j.declined.push(cid); j.log.push({ t:now(), s:`${cById(cid).n} ${why === 'expired' ? "didn't respond in 2 minutes" : 'passed'}` }); offerNext(j); }
function inviteBids(j){
  j.status = 'bidding'; j.bidsClose = now() + 30 * 60000; j.invited = eligibleList(j).filter(e => e.ok).map(e => e.c.id);
  j.log.push({ t:now(), s:`${j.invited.length} eligible contractors invited to quote` });
  j.invited.filter(id => id !== S.me).forEach((id, i) => setTimeout(() => {
    if(j.status !== 'bidding' || j.bids.some(b => b.cid === id)) return;
    const r = mulberry(hashStr(j.id + id)), base = j.price || (TYPES[j.type].hz ? 900 : 200);
    j.bids.push({ cid:id, price:Math.round(base * (0.85 + r() * 0.4) / 5) * 5, eta:etaMin(cById(id), j) + Math.round(r() * 60), note:j.hz ? 'Licensed removal, sealed and wrapped, clearance cert supplied' : '', at:now() }); render();
  }, 3000 + i * 2500));
}
const bidScore = (j, b) => { const c = cById(b.cid), base = j.price || Math.min(...j.bids.map(x => x.price)); return 0.5 * (base / b.price) + 0.3 * (15 / Math.max(15, b.eta)) + 0.2 * (c.rating / 5); };
function awardBest(j){
  if(j.hz && !j.approved) return 'Approve the hazardous job first';
  const ok = j.bids.filter(b => eligibility(cById(b.cid), j).ok).sort((a, b) => bidScore(j, b) - bidScore(j, a));
  if(!ok.length) return 'No eligible quotes yet';
  const b = ok[0], c = cById(b.cid);
  Object.assign(j, { status:'awarded', cid:b.cid, price:b.price, eta:b.eta, awardedAt:now() });
  j.log.push({ t:now(), s:`Quotes closed — awarded to ${c.n} at ${money(b.price)} (best score of ${ok.length})` });
  bookedNotify(j); if(b.cid !== S.me) simWork(j);
  return null;
}
function bookedNotify(j){ j.reports.map(id => REPORTS.find(r => r.id === id)).forEach(r => { r.status = 'underway'; notify(r, 'booked', `today (${cById(j.cid).n})`); woEvent(r, 'update'); }); }
// simulated contractors do the work, with real-looking evidence
function simWork(j){
  const r = mulberry(hashStr(j.id + 'work')), steps = ['enroute','onsite','collected','tipped'];
  steps.forEach((s, i) => setTimeout(() => { if(j.cid === S.me || ['verified','paid','query'].includes(j.status)) return; doStep(j, s, { sim:true, r }); render(); }, 6000 * (i + 1) + r() * 2000));
}
function doStep(j, step, o = {}){
  const t = TYPES[j.type], r = o.r || Math.random;
  if(step === 'enroute'){ j.status = 'enroute'; j.log.push({ t:now(), s:'On the way' }); }
  if(step === 'onsite'){ j.ev = j.ev || {}; j.ev.dist = o.dist ?? Math.round(15 + r() * 60); j.ev.before = true; j.status = 'onsite'; j.log.push({ t:now(), s:`Arrived ${j.ev.dist} m from the report, before photo taken` }); }
  if(step === 'collected'){ j.ev.after = true; j.status = 'collected'; j.log.push({ t:now(), s:'Collected, after photo taken' }); }
  if(step === 'tipped'){ const mid = (t.kg[0] + t.kg[1]) / 2; j.ev.kg = o.kg ?? Math.round(mid * (0.7 + r() * 0.6)); j.ev.facility = o.facility || (j.hz ? CITY().hzTip : CITY().tip);
    j.ev.ref = o.ref || String(4950000 + Math.floor(r() * 9999)) + '.0'; j.status = 'tipped'; j.log.push({ t:now(), s:`Tipped at ${j.ev.facility}, docket ${j.ev.ref}, ${j.ev.kg} kg` }); }
}
function verify(j){
  const t = TYPES[j.type], e = j.ev || {}, est = j.vol / t.vol * ((t.kg[0] + t.kg[1]) / 2);
  const checks = [
    ['Arrival within 150 m', (e.dist ?? 999) <= GEOFENCE_M, `${e.dist ?? '—'} m`],
    ['Before and after photos', !!(e.before && e.after), e.before && e.after ? 'both' : 'missing'],
    ['Docket weight plausible (±50%)', e.kg != null && e.kg >= est * 0.5 && e.kg <= est * 1.5, `${e.kg ?? '—'} kg vs about ${Math.round(est)} kg`],
    ['Licensed facility', !!e.facility, e.facility || '—']
  ];
  j.checks = checks;
  if(checks.every(c => c[1])){
    j.status = 'verified'; j.bill = { amt:j.price, gst:Math.round(j.price * 0.1 * 100) / 100, ref:`CB-INV-${j.id.slice(2)}` };
    j.log.push({ t:now(), s:`Proof checked — bill ${j.bill.ref} raised for ${money(j.price)} + GST` });
    const c = cById(j.cid); c.jobs++; c.rating = Math.round((c.rating * 0.95 + 5 * 0.05) * 100) / 100;
    j.reports.map(id => REPORTS.find(r => r.id === id)).forEach(r => { r.status = 'cleared'; notify(r, 'collected'); woEvent(r, 'close'); });
  } else { j.status = 'query'; j.log.push({ t:now(), s:`Proof check failed: ${checks.filter(c => !c[1]).map(c => c[0].toLowerCase()).join(', ')}` }); }
}

/* ---------- clock: offers expire after 2 minutes and pass on ---------- */
setInterval(() => {
  let ch = false;
  JOBS.forEach(j => { if(j.status === 'offered' && j.offer && now() > j.offer.until){ declineOffer(j, j.offer.cid, 'expired'); ch = true; } });
  if(ch) render(); else tickTimers();
}, 1000);

const RPT_DEFS = {
  overview:{ n:'Dumping overview', d:'Reports by channel, area and type, and how fast they were cleared', gen(){
    const R = REPORTS, by = (f) => Object.entries(R.reduce((m, r) => (m[f(r)] = (m[f(r)] || 0) + 1, m), {})).sort((a, b) => b[1] - a[1]);
    const cleared = JOBS.filter(j => ['verified','paid'].includes(j.status)), avg = cleared.length ? cleared.reduce((t, j) => t + (daysTo(j) || 0), 0) / cleared.length : 0;
    return { kpi:[['Reports', R.length], ['Cleared', R.filter(r => r.status === 'cleared').length], ['Duplicates merged', R.filter(r => r.status === 'merged').length], ['Average time to clear', avg ? `${fmt(avg * 24, 1)} h` : '—']],

    return { kpi:[['Contractors used', rows.length], ['Jobs', JOBS.filter(j => j.cid).length], ['Proof failures', rows.reduce((t, r) => t + r[3], 0)], ['Paid', money(JOBS.filter(j => j.status === 'paid').reduce((t, j) => t + j.price, 0))]],
      cols:['Contractor','Jobs','Completed','Proof failures','Paid (ex GST)','Rating'], rows }; } },
  hotspots:{ n:'Dumping hotspots', d:'Places reported more than once — candidates for cameras, signs or patrols', gen(){
    const m = {}; REPORTS.forEach(r => { const k = r.place; (m[k] = m[k] || []).push(r); });
    const rows = Object.entries(m).filter(([, v]) => v.length > 1).sort((a, b) => b[1].length - a[1].length).map(([k, v]) => [k, v.length, [...new Set(v.map(r => TYPES[r.ai.type].n))].join(', '), ago(Math.max(...v.map(r => r.time)))]);
    return { kpi:[['Hotspots', rows.length], ['Reports at hotspots', rows.reduce((t, r) => t + r[1], 0)]], cols:['Place','Reports','What','Latest'], rows }; } },
  spend:{ n:'Exchange spend', d:'What clearing dumped rubbish cost, by type', gen(){
    const m = {}; JOBS.filter(j => ['verified','paid'].includes(j.status)).forEach(j => { const k = TYPES[j.type].n; m[k] = m[k] || [0, 0]; m[k][0]++; m[k][1] += j.price; });
    const rows = Object.entries(m).map(([k, v]) => [k, v[0], money(v[1]), money(v[1] / v[0])]);
    return { kpi:[['Jobs paid or approved', rows.reduce((t, r) => t + r[1], 0)], ['Total (ex GST)', money(Object.values(m).reduce((t, v) => t + v[1], 0))]], cols:['Type','Jobs','Total','Average'], rows }; } },
  workorders:{ n:'Work orders in council systems', d:'Every report sent to Confirm, Salesforce and other connected systems', gen(){

};

async function loadXLSX(){ if(window.XLSX) return window.XLSX; await new Promise((ok, bad) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload = ok; s.onerror = () => bad(new Error('Could not load the spreadsheet library')); document.head.appendChild(s); }); return window.XLSX; }
async function saveFile(filename, data){
  try { const dl = window.claude && typeof window.claude.use === 'function' ? await window.claude.use('downloads') : null; if(dl){ await dl.save({ filename, data }); return 'saved'; } }
  catch(e){ if(e && e.code === 'declined') return 'declined'; }
  const url = URL.createObjectURL(new Blob([data], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' })); const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 5000); return 'saved';
}
async function reportXlsx(){
  try { const X = await loadXLSX(), d = RPT_DEFS[RPT.sel], R = d.gen(), wb = X.utils.book_new();
    X.utils.book_append_sheet(wb, X.utils.aoa_to_sheet([[`${d.n} — ${CITY().n} (sample)`], [`Generated ${new Date().toLocaleString('en-AU')}`], [], ...R.kpi]), 'Summary');
    X.utils.book_append_sheet(wb, X.utils.aoa_to_sheet([R.cols, ...R.rows]), 'Detail');
    const name = `citybrowser-${RPT.sel}-${new Date().toISOString().slice(0, 10)}.xlsx`, r = await saveFile(name, X.write(wb, { bookType:'xlsx', type:'array' }));
    RPT.msg = r === 'declined' ? 'Download cancelled.' : `${name} downloaded.`; } catch(e){ RPT.msg = `Couldn't build the spreadsheet: ${e.message}`; }
  render();
}

      ${shown.map(x => `<tr class="cs-tr" data-sel="${x.j ? x.j.id : x.r.id}" data-drawer="1" tabindex="0" aria-selected="${S.sel === (x.j ? x.j.id : x.r.id)}"><td><b>${x.r.id}</b>${x.r.thinkosRef ? `<br><span class="tiny mut">from ThinkOS ${x.r.thinkosRef}</span>` : ''}</td>

    <div class="cs-mapcol"><section class="cs-card cs-map" aria-label="Dumping map"><div class="hd"><div><h3>Dumping map</h3><span class="small mut">${esc(CITY().n)} · ${mapItems.length} open on the map</span></div>

      <a class="cs-matter" href="https://claude.ai/artifact/Ke3wPwh9EFtD14QLUadHv9" target="_blank" rel="noopener" aria-label="Matter®: ThinkOS, real time AI management (opens in a new tab)">

<script>
/* =====================================================================
   Alert sources — where new reports come from (phone, QR, SMS, email, web form, rangers' AR glasses),
   with each channel's address, volumes and a simulate button; and the outstanding jobs with progress.
   ===================================================================== */
const SRC_INFO = {
  phone:{ who:'Anyone', addr:() => '1300 248 900', how:'Calls are transcribed into a report' },
  sms:{ who:'Anyone', addr:() => '0480 024 890', how:'Text a photo and where it is' },
  email:{ who:'Anyone', addr:() => `rubbish@${CITY_K}.citybrowser.example`, how:'Attach photos if you can' },
  web:{ who:'Anyone', addr:() => 'citybrowser.example/report', how:'Place, photos, type, contact' },
  qr:{ who:'Anyone', addr:() => `${PLACES.length} codes on bins and signs`, how:'Location filled in from the code' },
  ar:{ who:'Rangers and crews', addr:() => 'AR glasses', how:'Captured, measured and verified on site' }
};
function srcStats(k){
  const R = REPORTS.filter(r => r.ch === k), last = R.reduce((m, r) => Math.max(m, r.time), 0);
  return { n:R.length, fresh:R.filter(r => r.status === 'new').length, last, day:R.filter(r => r.time > now() - 864e5).length };
}
function outstandingJobs(full){
  const L = JOBS.filter(j => !['paid'].includes(j.status)).sort((a, b) => (STAGE_AT[b.status] ?? 0) - (STAGE_AT[a.status] ?? 0) || a.created - b.created);
  return `<section class="cs-card oj" aria-label="Outstanding jobs"><div class="hd"><div><h3>Outstanding jobs</h3><span class="small mut">${L.length} not yet paid</span></div>
      ${full ? '' : '<button class="link small" data-cview="sources">See all</button>'}</div>
    <ul class="jlist" ${full ? 'style="max-height:none"' : ''}>${(full ? L : L.slice(0, 6)).map(j => { const age = ago(Math.min(j.created, ...j.reports.map(id => (REPORTS.find(r => r.id === id) || {}).time || j.created))).replace(' ago', '');
      return `<li><button class="jrow" data-sel="${j.id}" data-drawer="1"><span class="jt"><b>${esc(TYPES[j.type].n)}</b> <span class="tiny mut">${j.id} · ${esc(j.place)}</span></span>
      <span class="tiny mut">${j.cid ? esc(cById(j.cid).n) + (j.eta && ['awarded','enroute'].includes(j.status) ? ` · ${j.eta} min away` : '') : j.offer ? 'Offered to ' + esc(cById(j.offer.cid).n) : j.status === 'bidding' ? `${j.bids.length} ${j.bids.length === 1 ? 'quote' : 'quotes'} so far` : 'Waiting for a contractor'} · open ${age}${j.price ? ' · ' + money(j.price) : ''}</span>${jobProgress(j)}</button></li>`; }).join('') || '<li class="small mut">Nothing outstanding — every job is paid.</li>'}</ul>
    ${!full && L.length > 6 ? `<p class="tiny mut" style="margin:8px 0 0">and ${L.length - 6} more</p>` : ''}
    <div class="oj-sum">${[['Waiting', L.filter(j => ['posted','offered','bidding'].includes(j.status)).length], ['Underway', L.filter(j => ['awarded','enroute','onsite','collected'].includes(j.status)).length],
      ['Proof to check', L.filter(j => ['tipped','query'].includes(j.status)).length], ['Ready to pay', L.filter(j => j.status === 'verified').length]].map(([l, n]) => `<div><b>${n}</b><span>${l}</span></div>`).join('')}
      <p class="tiny mut">${money(L.reduce((t, j) => t + (j.price || 0), 0))} of work outstanding (ex GST)</p></div></section>`;
}
function alertSourcesSection(full){
  const tiles = Object.entries(CH).map(([k, c]) => { const st = srcStats(k), info = SRC_INFO[k];
    const recent = full ? REPORTS.filter(r => r.ch === k).slice(0, 3) : [];
    return `<div class="src"><div class="src-hd"><span class="chan">${icon(k)}</span><span><b>${esc(c.n)}</b><br><span class="tiny mut">${esc(info.who)}</span></span></div>
      <div class="src-n"><b>${st.n}</b><span class="small mut">${st.n === 1 ? 'report' : 'reports'}</span>
        ${st.fresh ? `<span class="cs-badge" title="New reports from this source">${st.fresh} new</span>` : ''}</div>
      <div class="tiny mut src-addr">${esc(info.addr()).replace(/([@.\/])/g, '$1<wbr>')}<br>${st.last ? `${st.day ? `${st.day} today · last` : 'Last'} ${ago(st.last)}` : 'None yet'}</div>
      ${full ? `<div class="small ink2" style="margin-top:6px">${esc(info.how)}</div>${recent.length ? `<ul class="src-recent">${recent.map(r => `<li><button class="link small" data-sel="${r.jobId || r.id}" data-drawer="1">${r.id}</button> ${esc(TYPES[r.ai.type].n)} · ${esc(r.place)} <span class="mut">· ${ago(r.time)}</span></li>`).join('')}</ul>` : ''}` : ''}
      <div class="src-act"><button class="btn sm" data-sim="${k}" aria-label="Simulate a ${esc(c.n)} report">Simulate a report</button>
        <span class="src-alt">${k === 'sms' ? '<button class="link tiny" data-sim="vague" title="Simulate a text with no clear place">or with no clear place</button>' : '&nbsp;'}</span></div></div>`; }).join('');
  const total = REPORTS.length, today = REPORTS.filter(r => r.time > now() - 864e5).length;
  const head = `<div class="hd"><div><h3>Alert sources</h3><span class="small mut">${total} reports from ${Object.keys(CH).length} channels · ${today} in the last 24 hours</span></div>${full ? '' : '<button class="link small" data-cview="sources">Set up sources</button>'}</div>`;
  if(!full) return `<div class="cs-srcrow"><section class="cs-card" aria-label="Alert sources">${head}<div class="srcgrid">${tiles}</div></section>${outstandingJobs(false)}</div>`;
  return `<div class="cs-srcrow full"><section class="cs-card" aria-label="Alert sources">${head}<div class="srcgrid">${tiles}</div>
      <div class="note">Numbers and addresses are samples. Each council gets its own phone and SMS numbers, inbox and QR range; QR codes are printed from Rates and channels. Every source lands in the same queue, is checked for duplicates and gets the same updates.</div></section>

<script>
/* =====================================================================
   Photo uploads everywhere (camera on phones), resized in the browser to 1280 px JPEG.
   Targets: form · rep:<id> · before:<job> · after:<job> · docket:<job> · oosnew · oosb:<req> · oosa:<req>
   ===================================================================== */
const uploadBtn = (target, label, opts = {}) => `<label class="btn upl${opts.cls ? ' ' + opts.cls : ''}">${opts.icon === false ? '' : '📷 '}${esc(label)}<input type="file" accept="image/*" ${opts.capture === false ? '' : 'capture="environment"'} ${opts.multiple === false ? '' : 'multiple'} data-upload="${target}" aria-label="${esc(label)}"></label>`;
const thumbs = (urls, alt) => urls.length ? `<div class="thumbs">${urls.map((u, i) => `<img src="${u}" alt="${esc(alt)} ${i + 1}">`).join('')}</div>` : '';
function shrink(file){
  return new Promise((ok, bad) => { const fr = new FileReader(); fr.onerror = bad; fr.onload = () => { const im = new Image(); im.onerror = bad; im.onload = () => {
    const k = Math.min(1, 1280 / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
    c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); ok(c.toDataURL('image/jpeg', 0.8)); }; im.src = fr.result; }; fr.readAsDataURL(file); });
}
function addPhoto(target, url){
  const [kind, id] = target.split(':'), J = () => JOBS.find(j => j.id === id), jp = j => (j.photos = j.photos || { before:[], after:[], docket:[] });
  if(kind === 'form'){ S.form.photos = (S.form.photos || []).concat(url).slice(0, 4); S.form.photoUrl = S.form.photos[0]; S.form.err = ''; }
  else if(kind === 'rep'){ const r = REPORTS.find(x => x.id === id); if(!r.photoUrl) r.photoUrl = url; else (r.morePhotos = r.morePhotos || []).push(url); r.photos = Math.max(1, r.photos); r.log.push({ t:now(), s:'Photo added' }); }
  else if(kind === 'before'){ const j = J(); jp(j).before.push(url); j.tmpBefore = true; j.log.push({ t:now(), s:'Before photo uploaded' }); }
  else if(kind === 'after'){ const j = J(); jp(j).after.push(url); j.tmpAfter = true; j.log.push({ t:now(), s:'After photo uploaded' }); }
  else if(kind === 'docket'){ const j = J(); jp(j).docket.push(url); j.log.push({ t:now(), s:'Docket photo uploaded' }); }
  else if(kind === 'oosnew'){ const F = oosS().form; F.photos = (F.photos || []).concat(url).slice(0, 4); }
  else if(kind === 'oosb' || kind === 'oosa'){ const r = oosS().reqs.find(x => x.id === id); r.photos[kind === 'oosb' ? 'before' : 'after'].push(url); }
}
document.addEventListener('change', async e => {
  const t = e.target.closest && e.target.closest('[data-upload]'); if(!t || !t.files || !t.files.length) return;
  const target = t.dataset.upload, files = [...t.files].filter(f => /^image\//.test(f.type));
  if(!files.length){ S.toast = 'Choose a photo (JPEG, PNG or HEIC).'; render(); return; }
  try { for(const f of files.slice(0, 4)) addPhoto(target, await shrink(f)); S.toast = files.length > 1 ? `${files.length} photos added` : 'Photo added'; }
  catch(_){ S.toast = "That photo couldn't be read. Try another one."; }
  render();
});
const afterImg = j => j.photos && j.photos.after && j.photos.after[0] ? `<img class="photo" src="${j.photos.after[0]}" alt="After: area clear">` : dumpSVG(j.type, j.id + ' after', true);

/* =====================================================================
   OUT-OF-SCOPE WORK (from ThinkOS) — an existing contractor finds work outside their contract (dumping
   beside a bin, a mattress, an extra lift after an event) and asks the council in real time, from the app
   or AR glasses. Pre-agreed rules decide instantly (auto-approve up to a limit, ask me, leave in place);
   if nobody answers in time the agreed default applies. Done work needs an after photo and actual
   quantity and lands on the contractor's invoice; AIRS rule R18 checks the invoice against approvals.
   Rates are sample — load the contract's schedule of rates.
   ===================================================================== */
const OOS_TYPES = [
  { k:'dump', t:'Illegal dumping beside a bin', unit:'m³', rate:95 }, { k:'bulky', t:'Dumped mattress or furniture', unit:'item', rate:45 },
  { k:'event', t:'Extra lift after an event', unit:'lift', rate:28 }, { k:'sharps', t:'Discarded syringes', unit:'callout', rate:120, haz:true },
  { k:'asbestos', t:'Suspected asbestos dumped', unit:'callout', rate:0, haz:true, never:true } ];
const OOS_ST = { pending:['Awaiting decision','dup'], approved:['Approved — collect','ok'], declined:['Leave in place',''], done:['Done','ok'] };
const OOS_STORE = {}, R18_FLOOR = 5;
const oosT = k => OOS_TYPES.find(t => t.k === k);
function oosS(){

<script>
/* =====================================================================
   Job progress bar (7 stages) and the full-screen map.

const STAGES = ['Posted','Booked','On the way','On site','Collected','Proof','Paid'];
const STAGE_AT = { posted:0, offered:0, bidding:0, awarded:1, enroute:2, onsite:3, collected:4, tipped:5, query:5, verified:6, paid:7 };
function jobProgress(j, opts = {}){
  const at = STAGE_AT[j.status] ?? 0, n = STAGES.length, bad = j.status === 'query';
  const label = at >= n ? 'Paid' : STAGES[at] + (bad ? ' — failed, resubmit' : j.status === 'offered' ? ' — offered' : j.status === 'bidding' ? ' — quotes' : j.status === 'verified' ? ' — approve payment' : j.status === 'tipped' ? ' — to check' : '');
  const seg = STAGES.map((s, i) => `<span class="${i < at ? 'done' : i === at ? (bad ? 'bad' : 'on') : ''}" title="${s}"></span>`).join('');
  return `<div class="jprog${opts.full ? ' full' : ''}" role="progressbar" aria-label="Job progress: ${esc(label)}" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${Math.min(at, n)}">
    <div class="jbar">${seg}</div>${opts.full ? `<div class="jlabels">${STAGES.map((s, i) => `<span class="${i < at ? 'done' : i === at ? 'on' : ''}">${s}</span>`).join('')}</div>`
      : `<div class="jtext"><span>${esc(label)}</span><span>${Math.min(at + (at >= n ? 0 : 1), n)}/${n}</span></div>`}</div>`;
}
function jobsInProgress(){
  const L = JOBS.filter(j => !['paid'].includes(j.status)).sort((a, b) => (STAGE_AT[b.status] ?? 0) - (STAGE_AT[a.status] ?? 0));

      <span class="tiny mut">${j.cid ? esc(cById(j.cid).n) + (j.eta && ['awarded','enroute'].includes(j.status) ? ` · ${j.eta} min away` : '') : j.offer ? 'Offered to ' + esc(cById(j.offer.cid).n) : j.status === 'bidding' ? `${j.bids.length} quotes` : ''}</span>${jobProgress(j)}</button></li>`).join('') || '<li class="small mut">No jobs in progress.</li>'}</ul></section>`;

  let nx = x, ny = y, nw = w, nh = h;
  if(w / h < A){ nw = h * A; nx = x - (nw - w) / 2; } else { nh = w / A; ny = y - (nh - h) / 2; }

<script>
/* =====================================================================

    contractors:CONTRACTORS.map(c => ({ name:c.n, online:c.online, vehicle:c.veh, rating:c.rating })), outOfScopeWaiting:oosS().reqs.filter(x => x.status === 'pending').map(x => ({ ref:x.id, task:oosT(x.k).t, place:x.place })) };

const AS_ACT = {
  open(ref){ const R = (ref || '').toUpperCase().replace(/\s+/g, ''); const r = REPORTS.find(x => x.id === R), j = JOBS.find(x => x.id === R) || (r && r.jobId && JOBS.find(x => x.id === r.jobId));
    const id = (j || r || {}).id; if(!id) return `I can't find ${ref}.`;

    const r = CITY().sims()[k](); S.sel = r.id; if(S.view === 'map') S.tab = 'new'; render(); return `New ${chName(r.ch)} report ${r.id}: ${TYPES[r.ai.type].n.toLowerCase()} at ${r.place}${r.x == null ? ' — it needs a pin' : ''}${r.dupOf ? ` (looks like ${r.dupOf})` : ''}.`; }

// instant answers for common requests (no AI call)

    const r = await AS.sample(history, { modelTier:'quick', cache:false, signal:AS.ctl.signal, onText:({ text }) => { bot.text = text; asDraw(); },
      tools:[
        { name:'open_item', description:'Open a report (CB-…) or job (J-…) in the details panel', inputSchema:{ type:'object', properties:{ ref:{ type:'string' } }, required:['ref'] }, execute:({ ref }) => AS_ACT.open(ref) },
        { name:'go_to_page', description:'Show a page: overview, alert sources, reports and jobs, contractors, out of scope, rates, messages, reports, integrations', inputSchema:{ type:'object', properties:{ page:{ type:'string' } }, required:['page'] }, execute:({ page }) => AS_ACT.go(page) },
        { name:'switch_council', description:'Switch to Port Stephens Council, City of Stirling or Town of Cambridge', inputSchema:{ type:'object', properties:{ council:{ type:'string' } }, required:['council'] }, execute:({ council }) => AS_ACT.council(council) },
        { name:'simulate_report', description:'Simulate an incoming report by phone, qr, sms, email, web or ar (ranger)', inputSchema:{ type:'object', properties:{ channel:{ type:'string' } }, required:['channel'] }, execute:({ channel }) => AS_ACT.simulate(channel) } ] });

let PKV = null;   // index of the screen open in the viewer
function pickupStrip(keys, title, lead){
  const L = keys ? PICKUP_SHOTS.filter(s => keys.includes(s.k)) : PICKUP_SHOTS;
  return `<section class="pkstrip" aria-label="${esc(title)}"><div class="hd" style="margin-bottom:4px"><h2>${esc(title)}</h2></div>${lead ? `<p class="small ink2" style="margin:0 0 10px;max-width:70ch">${esc(lead)}</p>` : ''}
    <ol class="pkrow">${L.map((s, i) => `<li><button class="pkshot" data-pkopen="${PICKUP_SHOTS.indexOf(s)}" aria-label="${esc(s.t)}: ${esc(s.c)}"><img src="${s.src}" alt="" loading="lazy" width="195" height="422"></button>
      <b>${keys ? '' : `${i + 1}. `}${esc(s.t)}</b><span>${esc(s.c)}</span></li>`).join('')}</ol></section>`;
}
function pickupViewer(){
  if(PKV == null) return ''; const s = PICKUP_SHOTS[PKV];
  return `<div role="dialog" aria-modal="true" aria-label="PickUp screen: ${esc(s.t)}" data-pkbg style="position:fixed;inset:0;z-index:70;background:rgba(12,37,56,.7);display:grid;place-items:center;padding:16px">
    <div style="display:flex;align-items:center;gap:14px"><button class="btn" data-pkstep="-1" aria-label="Previous screen" ${PKV ? '' : 'disabled'}>‹</button>
      <figure style="margin:0;text-align:center;color:#fff"><div class="phone" style="width:300px;padding:10px"><img src="${s.src}" alt="${esc(s.t)}" style="display:block;width:100%;border-radius:26px"></div>
        <figcaption style="margin-top:10px;max-width:300px"><b>${PKV + 1} of ${PICKUP_SHOTS.length} · ${esc(s.t)}</b><br><span class="small">${esc(s.c)}</span></figcaption></figure>
      <button class="btn" data-pkstep="1" aria-label="Next screen" ${PKV < PICKUP_SHOTS.length - 1 ? '' : 'disabled'}>›</button></div>
    <button class="btn" data-pkclose style="position:absolute;top:16px;right:16px" aria-label="Close">✕</button></div>`;
}
document.addEventListener('click', e => {
  const o = e.target.closest('[data-pkopen]'), st = e.target.closest('[data-pkstep]');
  if(o){ PKV = +o.dataset.pkopen; render(); return; }
  if(st){ PKV = Math.max(0, Math.min(PICKUP_SHOTS.length - 1, PKV + +st.dataset.pkstep)); render(); return; }
  if(PKV != null && (e.target.closest('[data-pkclose]') || e.target.matches('[data-pkbg]'))){ PKV = null; render(); }
});
document.addEventListener('keydown', e => {
  if(PKV == null) return;
  if(e.key === 'Escape'){ PKV = null; render(); } else if(e.key === 'ArrowRight' && PKV < PICKUP_SHOTS.length - 1){ PKV++; render(); } else if(e.key === 'ArrowLeft' && PKV > 0){ PKV--; render(); }
});

<script>
/* ---------- CONTRACTOR portal + PickUp phone ---------- */
const me = () => cById(S.me);
const myOffers = () => JOBS.filter(j => j.status === 'offered' && j.offer?.cid === S.me);
const myInvites = () => JOBS.filter(j => j.status === 'bidding' && (j.invited || []).includes(S.me));
const myActive = () => JOBS.filter(j => j.cid === S.me && ['awarded','enroute','onsite','collected','query'].includes(j.status));
const myDone = () => JOBS.filter(j => j.cid === S.me && ['tipped','verified','paid'].includes(j.status));
function contractorMapItems(){
  const it = [];
  myOffers().forEach(j => it.push({ o:j, label:j.id + ' offer', col:COL.offered, id:j.id }));
  myInvites().forEach(j => it.push({ o:j, label:j.id + ' quote', col:COL.bidding, id:j.id }));
  myActive().forEach(j => it.push({ o:j, label:j.id + ' job', col:COL[j.status], id:j.id }));
  return it;
}
function renderContractor(){
  const cv = `<div class="cs-seg" role="group" aria-label="Contractor work" style="margin-left:auto"><button data-cv2="jobs" aria-pressed="${S.cview2 !== 'oos'}">Exchange jobs</button><button data-cv2="oos" aria-pressed="${S.cview2 === 'oos'}">Out-of-scope work${oosS().reqs.filter(x => x.by === me().n && x.status === 'approved').length ? ` · ${oosS().reqs.filter(x => x.by === me().n && x.status === 'approved').length} to do` : ''}</button></div>`;
  if(S.cview2 === 'oos') return `<div class="sub" role="group" aria-label="Contractor"><label class="small" style="display:flex;align-items:center;gap:8px">Signed in as <select class="inp" id="meSel" style="width:auto">${CONTRACTORS.map(x => `<option value="${x.id}" ${x.id === S.me ? 'selected' : ''}>${esc(x.n)}</option>`).join('')}</select></label>${cv}</div>${renderOOS(false)}`;
  const c = me(), act = myActive()[0], radius = `<circle cx="${c.x}" cy="${c.y}" r="${c.km / KM}" fill="rgba(18,50,74,.05)" stroke="#12324A" stroke-width=".5" stroke-dasharray="2 2"/>`;
  const tabs = [['foryou', `For you`, myOffers().length + myInvites().filter(j => !j.bids.some(b => b.cid === S.me)).length], ['jobs','My jobs', myActive().length], ['docs','Documents', c.lic.filter(l => l[1] < D(30)).length + (c.ins < D(30) ? 1 : 0)], ['pay','Earnings', 0]];
  let body = '';
  if(S.ctab === 'foryou'){
    body = myOffers().map(j => `<div class="panel pad" style="margin-bottom:10px;border-color:var(--amber)"><div class="hd"><h3>${esc(TYPES[j.type].n)}</h3><b>${money(j.price)}</b></div>
      <div class="small ink2">${esc(j.place)} · ${fmt(dist(c, j), 1)} km · ${j.vol} m³ · ${LIC_N[TYPES[j.type].lic]}</div>
      <div class="note">Offered to you first. <b data-countdown="${j.offer.until}">${Math.max(0, Math.ceil((j.offer.until - now()) / 1000))} s</b> left, then it goes to the next nearest.</div>
      <div class="btns"><button class="btn amb" data-act="accept" data-id="${j.id}">Accept job</button><button class="btn" data-act="pass" data-id="${j.id}">Pass</button></div></div>`).join('')
    + myInvites().map(j => { const mine = j.bids.find(b => b.cid === S.me);
      return `<div class="panel pad" style="margin-bottom:10px"><div class="hd"><h3>Quote: ${esc(TYPES[j.type].n)}</h3>${j.hz ? '<span class="flag hz">Hazardous</span>' : ''}</div>
        <div class="small ink2">${esc(j.place)} · ${fmt(dist(c, j), 1)} km · about ${j.vol} m³${j.price ? ` · council guide ${money(j.price)}` : ''}</div>
        ${mine ? `<div class="okmsg">Your sealed quote: ${money(mine.price)}, can start in ${mine.eta} min.</div>` : `<div class="kv" style="margin-top:8px;align-items:center"><span>Your price (ex GST)</span><span><input class="inp" type="number" min="0" step="5" id="bp-${j.id}" value="${j.price || (j.hz ? 950 : 220)}" style="width:120px"></span>
        <span>Can start in (min)</span><span><input class="inp" type="number" min="5" step="5" id="be-${j.id}" value="${etaMin(c, j) + 20}" style="width:120px"></span><span>Note</span><span><input class="inp" id="bn-${j.id}" placeholder="${j.hz ? 'Licence, method, clearance certificate' : 'Optional'}"></span></div>
        <div class="btns"><button class="btn pri" data-act="bid" data-id="${j.id}">Send quote</button></div>`}</div>`; }).join('')
    || `<p class="small ink2">No offers right now. You're ${c.online ? 'online' : 'offline'} — jobs within ${c.km} km that match your licences will appear here and on PickUp.</p>`;
  }
  if(S.ctab === 'jobs') body = myActive().map(j => stepCard(j, false)).join('') || '<p class="small ink2">No jobs underway.</p>';
  if(S.ctab === 'docs') body = `<table><thead><tr><th>Document</th><th>Expires</th></tr></thead><tbody>${c.lic.map(([k, e]) => `<tr><td>${LIC_N[k]} licence</td><td><span class="flag ${e < now() ? 'hz' : e < D(30) ? 'dup' : 'ok'}">${e < now() ? 'Expired — you get no ' + LIC_N[k].toLowerCase() + ' jobs' : new Date(e).toLocaleDateString('en-AU')}</span></td></tr>`).join('')}
      <tr><td>Public liability insurance</td><td><span class="flag ${c.ins < now() ? 'hz' : c.ins < D(30) ? 'dup' : 'ok'}">${new Date(c.ins).toLocaleDateString('en-AU')}</span></td></tr></tbody></table>

  if(t.id === 'rType'){ const r = R(t.dataset.id); r.ai.type = t.value; r.ai.hz = !!TYPES[t.value].hz; r.log.push({ t:now(), s:`Council set type to ${TYPES[t.value].n.toLowerCase()}` }); render(); }
  if(t.id === 'rVol'){ R(t.dataset.id).ai.vol = Math.max(0.1, +t.value || 0.1); render(); }
  if(t.id === 'rReject' && t.value){ const r = REPORTS.find(x => x.id === S.sel); r.status = 'rejected'; r.reject = t.value; r.log.push({ t:now(), s:`Rejected: ${t.value}` }); notify(r, 'rejected', t.value.replace(/^./, m => m.toLowerCase()) + '.'); woEvent(r, 'cancel'); toast(`${r.id} closed`); render(); }
  if(t.dataset.rate){ TYPES[t.dataset.rate].rate = Math.max(0, +t.value); toast('Rate saved'); render(); }
  if(t.dataset.online){ cById(t.dataset.online).online = t.checked; render(); }
  if(t.dataset.panel){ cById(t.dataset.panel).panel = t.checked; render(); }
  if(t.id === 'qrPlace'){ S.qrPlace = t.value; render(); }
  if(t.dataset.connOn){ INT.conns.find(c => c.id === t.dataset.connOn).on = t.checked; render(); }
  if(t.dataset.connEv){ const [id, ev] = t.dataset.connEv.split(':'); INT.conns.find(c => c.id === id).events[ev] = t.checked; }
  if(t.dataset.connShare){ INT.conns.find(c => c.id === t.dataset.connShare).shareReporter = t.checked; }
  if(t.dataset.connMap){ const [id, k] = t.dataset.connMap.split(':'); INT.conns.find(c => c.id === id).map[k] = t.value; S.toast = 'Code saved'; render(); }
  if(t.id === 'icSys'){ INT.form.sys = t.value; }
  if(t.id === 'meSel'){ S.me = t.value; S.sel = null; render(); }
  if(t.id === 'fPlace'){ S.form.place = t.value || null; S.form.qr = false; S.form.err = ''; render(); }
  if(t.dataset.before){ JOBS.find(j => j.id === t.dataset.before).tmpBefore = t.checked; render(); }
  if(t.dataset.after){ JOBS.find(j => j.id === t.dataset.after).tmpAfter = t.checked; render(); }
});
document.addEventListener('click', e => { const c = e.target.closest('[data-ftype]'); if(c){ S.form.type = c.dataset.ftype; S.form.err = ''; render(); } });
document.addEventListener('keydown', e => {
  const k = e.target.closest && e.target.closest('[data-knob]');
  if(k && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); acceptOffer(JOBS.find(j => j.id === k.dataset.knob), S.me); toast('Job accepted'); render(); }
  const m = e.target.closest && e.target.closest('.mk');
  if(m && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); m.dispatchEvent(new MouseEvent('click', { bubbles:true })); }
});
// slide to accept
let drag = null;
document.addEventListener('pointerdown', e => { const k = e.target.closest('[data-knob]'); if(!k) return; drag = { k, x:e.clientX, w:k.parentElement.clientWidth - 52 }; k.setPointerCapture(e.pointerId); });
document.addEventListener('pointermove', e => { if(!drag) return; const dx = Math.max(0, Math.min(drag.w, e.clientX - drag.x)); drag.k.style.left = (4 + dx) + 'px'; drag.dx = dx; });
document.addEventListener('pointerup', () => { if(!drag) return; const ok = (drag.dx || 0) > drag.w * 0.88, id = drag.k.dataset.knob; drag.k.style.left = '4px'; drag = null;
  if(ok){ acceptOffer(JOBS.find(j => j.id === id), S.me); toast('Job accepted — head there now'); render(); } });

seed(); render();
</script>
